# Imported into the target's Azure Repos mirror; never connected to this repository.
trigger:
  branches:
    include: [main]
  tags:
    include: ['v*']
pr: none
parameters:
  - name: variableGroup
    type: string
    default: semantic-workbench-target
  - name: acrServiceConnection
    type: string
    default: sw-azure-push
  - name: deployServiceConnection
    type: string
    default: sw-azure-deploy
  - name: deployEnvironment
    type: string
    default: production
  - name: agentPool
    type: string
    default: ''
  - name: vmImage
    type: string
    default: ubuntu-latest
variables:
  - group: ${{ parameters.variableGroup }}
pool:
  ${{ if ne(parameters.agentPool, '') }}:
    name: ${{ parameters.agentPool }}
  ${{ else }}:
    vmImage: ${{ parameters.vmImage }}
stages:
  - stage: Validate
    jobs:
      - template: deploy/azure-devops/templates/validate-jobs.yml
  - stage: Image
    dependsOn: Validate
    jobs:
      - template: deploy/azure-devops/templates/image-jobs.yml
        parameters:
          acrServiceConnection: ${{ parameters.acrServiceConnection }}
  - stage: Deploy
    dependsOn: Image
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    lockBehavior: runLatest
    variables:
      imageDigest: $[ stageDependencies.Image.image.outputs['push.digest'] ]
    jobs:
      - deployment: deploy
        environment: ${{ parameters.deployEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy/azure-devops/templates/setup-steps.yml
                  parameters:
                    browsers: false
                - template: deploy/azure-devops/templates/deploy-steps.yml
                  parameters:
                    deployServiceConnection: ${{ parameters.deployServiceConnection }}
