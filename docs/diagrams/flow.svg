.lbl-in-g{stroke:var(--gs)}
.lbl-in-b{stroke:var(--bs)}
.lbl-in-v{stroke:var(--vs)}
.lbl-in-a{stroke:var(--as)}
.lbl-in-r{stroke:var(--rs)}
.lbl-in-n{stroke:var(--ns)}
.ar-n{stroke:var(--edge)} .tip-n{fill:var(--edge)}
.never{fill:var(--rs);stroke:var(--r);stroke-width:1.6;stroke-dasharray:3 6;stroke-linecap:round}
.k-g .card{fill:var(--surface);stroke:var(--gb)} .k-g .bar{fill:var(--g)} .k-g .ct{fill:var(--gt)} .k-g .chip{fill:var(--gs);stroke:var(--gb)} .k-g .chiptxt{fill:var(--gt)}
.rg-g{fill:var(--gs);stroke:var(--gb)} .rgt-g{fill:var(--gt)}
.ar-g{stroke:var(--g)} .tip-g{fill:var(--g)}
.k-b .card{fill:var(--surface);stroke:var(--bb)} .k-b .bar{fill:var(--b)} .k-b .ct{fill:var(--bt)} .k-b .chip{fill:var(--bs);stroke:var(--bb)} .k-b .chiptxt{fill:var(--bt)}
.rg-b{fill:var(--bs);stroke:var(--bb)} .rgt-b{fill:var(--bt)}
.ar-b{stroke:var(--b)} .tip-b{fill:var(--b)}
.k-v .card{fill:var(--surface);stroke:var(--vb)} .k-v .bar{fill:var(--v)} .k-v .ct{fill:var(--vt)} .k-v .chip{fill:var(--vs);stroke:var(--vb)} .k-v .chiptxt{fill:var(--vt)}
.rg-v{fill:var(--vs);stroke:var(--vb)} .rgt-v{fill:var(--vt)}
.ar-v{stroke:var(--v)} .tip-v{fill:var(--v)}
.k-a .card{fill:var(--surface);stroke:var(--ab)} .k-a .bar{fill:var(--a)} .k-a .ct{fill:var(--at)} .k-a .chip{fill:var(--as);stroke:var(--ab)} .k-a .chiptxt{fill:var(--at)}
.rg-a{fill:var(--as);stroke:var(--ab)} .rgt-a{fill:var(--at)}
.ar-a{stroke:var(--a)} .tip-a{fill:var(--a)}
.k-r .card{fill:var(--surface);stroke:var(--rb)} .k-r .bar{fill:var(--r)} .k-r .ct{fill:var(--rt)} .k-r .chip{fill:var(--rs);stroke:var(--rb)} .k-r .chiptxt{fill:var(--rt)}
.rg-r{fill:var(--rs);stroke:var(--rb)} .rgt-r{fill:var(--rt)}
.ar-r{stroke:var(--r)} .tip-r{fill:var(--r)}
.k-n .card{fill:var(--surface);stroke:var(--nb)} .k-n .bar{fill:var(--n)} .k-n .ct{fill:var(--nt)} .k-n .chip{fill:var(--ns);stroke:var(--nb)} .k-n .chiptxt{fill:var(--nt)}
.rg-n{fill:var(--ns);stroke:var(--nb)} .rgt-n{fill:var(--nt)}
.ar-n{stroke:var(--n)} .tip-n{fill:var(--n)}
</style><rect class="bg" width="1240" height="1146" rx="24"/><text x="30" y="44" class="title" text-anchor="start">How a request and an edit travel</text><text x="30" y="68" class="sub" text-anchor="start">Files in the project folders are the source of truth; the SQLite index is rebuilt from them.</text><g class="k-g"><rect x="700" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="719" y="42" class="s" text-anchor="start">Browser</text><g class="k-b"><rect x="789.3" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="808.3" y="42" class="s" text-anchor="start">Server</text><g class="k-v"><rect x="871.6999999999999" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="890.6999999999999" y="42" class="s" text-anchor="start">Access</text><g class="k-n"><rect x="954.0999999999999" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="973.0999999999999" y="42" class="s" text-anchor="start">Storage</text><g class="k-r"><rect x="1043.3999999999999" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="1062.3999999999999" y="42" class="s" text-anchor="start">Safeguard</text><g><rect x="30" y="96" width="1180" height="200" rx="20" class="region rg-n"/><text x="52" y="126" class="rgt rgt-n">Request path</text></g><g class="k-g"><rect x="50" y="146" width="190" height="123" rx="14" class="card"/><rect x="60" y="159" width="4" height="97" rx="2" class="bar"/><text x="76" y="173" class="t">Browser app</text><text x="76" y="194" class="s">src/app: React views,</text><text x="76" y="213" class="s">editors and workers;</text><text x="76" y="232" class="s">api.ts is the HTTP</text><text x="76" y="251" class="s">client</text></g><g class="k-b"><rect x="288" y="146" width="190" height="123" rx="14" class="card"/><rect x="298" y="159" width="4" height="97" rx="2" class="bar"/><text x="314" y="173" class="t">HTTP handler</text><text x="314" y="194" class="s">handler.ts, request.ts:</text><text x="314" y="213" class="s">bounded body and path</text><text x="314" y="232" class="s">parsing, static files,</text><text x="314" y="251" class="s">health probes</text></g><g class="k-v"><rect x="526" y="146" width="190" height="123" rx="14" class="card"/><rect x="536" y="159" width="4" height="97" rx="2" class="bar"/><text x="552" y="173" class="t">Access boundary</text><text x="552" y="194" class="s">middleware.ts: identity</text><text x="552" y="213" class="s">resolved once, route</text><text x="552" y="232" class="s">mapped to an action;</text><text x="552" y="251" class="s">unmapped routes refused</text></g><g class="k-b"><rect x="764" y="146" width="190" height="123" rx="14" class="card"/><rect x="774" y="159" width="4" height="97" rx="2" class="bar"/><text x="790" y="173" class="t">Resource routes</text><text x="790" y="194" class="s">src/server/routes:</text><text x="790" y="213" class="s">parse typed requests</text><text x="790" y="232" class="s">and call the owning</text><text x="790" y="251" class="s">service</text></g><g class="k-b"><rect x="1002" y="146" width="190" height="123" rx="14" class="card"/><rect x="1012" y="159" width="4" height="97" rx="2" class="bar"/><text x="1028" y="173" class="t">Workspace service</text><text x="1028" y="194" class="s">projects/workspace.ts:</text><text x="1028" y="213" class="s">registration, reads,</text><text x="1028" y="232" class="s">saves, Git, journals</text><text x="1028" y="251" class="s">and live events</text></g><path d="M240 207 L288 207" class="ar ar-g"/><polygon points="288,207 279.2,201.5 279.2,212.5" class="tip-g"/><text x="264.0" y="178" class="lbl lbl-in-n" text-anchor="middle">HTTP</text><text x="264.0" y="193" class="lbl lbl-in-n" text-anchor="middle">JSON</text><path d="M478 207 L526 207" class="ar ar-n"/><polygon points="526,207 517.2,201.5 517.2,212.5" class="tip-n"/><text x="502.0" y="178" class="lbl lbl-in-n" text-anchor="middle">every</text><text x="502.0" y="193" class="lbl lbl-in-n" text-anchor="middle">request</text><path d="M716 207 L764 207" class="ar ar-n"/><polygon points="764,207 755.2,201.5 755.2,212.5" class="tip-n"/><text x="740.0" y="178" class="lbl lbl-in-n" text-anchor="middle">action,</text><text x="740.0" y="193" class="lbl lbl-in-n" text-anchor="middle">scope</text><path d="M954 207 L1002 207" class="ar ar-n"/><polygon points="1002,207 993.2,201.5 993.2,212.5" class="tip-n"/><text x="978.0" y="178" class="lbl lbl-in-n" text-anchor="middle">typed</text><text x="978.0" y="193" class="lbl lbl-in-n" text-anchor="middle">call</text><g><rect x="30" y="326" width="1180" height="170" rx="20" class="region rg-b"/><text x="52" y="356" class="rgt rgt-b">Workspace service</text><text x="1188" y="356" class="s" text-anchor="end">src/server/projects/</text></g><g class="k-b"><rect x="50" y="376" width="190" height="104" rx="14" class="card"/><rect x="60" y="389" width="4" height="78" rx="2" class="bar"/><text x="76" y="403" class="t">Live events</text><text x="76" y="424" class="s">Filtered server-sent</text><text x="76" y="443" class="s">events (/api/events),</text><text x="76" y="462" class="s">one view per reader</text></g><g class="k-r"><rect x="288" y="376" width="190" height="104" rx="14" class="card"/><rect x="298" y="389" width="4" height="78" rx="2" class="bar"/><text x="314" y="403" class="t">Content guards</text><text x="314" y="424" class="s">Judge every write</text><text x="314" y="443" class="s">target before any</text><text x="314" y="462" class="s">byte changes</text></g><g class="k-b"><rect x="526" y="376" width="190" height="104" rx="14" class="card"/><rect x="536" y="389" width="4" height="78" rx="2" class="bar"/><text x="552" y="403" class="t">Saves</text><text x="552" y="424" class="s">Hash-checked atomic</text><text x="552" y="443" class="s">replace of changed</text><text x="552" y="462" class="s">files, then reindex</text></g><g class="k-b"><rect x="764" y="376" width="190" height="104" rx="14" class="card"/><rect x="774" y="389" width="4" height="78" rx="2" class="bar"/><text x="790" y="403" class="t">Git</text><text x="790" y="424" class="s">git.ts subprocesses,</text><text x="790" y="443" class="s">serialized per</text><text x="790" y="462" class="s">repository</text></g><g class="k-b"><rect x="1002" y="376" width="190" height="104" rx="14" class="card"/><rect x="1012" y="389" width="4" height="78" rx="2" class="bar"/><text x="1028" y="403" class="t">Journal</text><text x="1028" y="424" class="s">Recovery journal for</text><text x="1028" y="443" class="s">multi-file, folder and</text><text x="1028" y="462" class="s">registry changes</text></g><path d="M1097.0 269 L1097.0 326" class="ar ar-n"/><polygon points="1097.0,326 1091.5,317.2 1102.5,317.2" class="tip-n"/><text x="1047.0" y="305" class="lbl" text-anchor="middle">composes</text><path d="M478 428 L526 428" class="ar ar-r"/><polygon points="526,428 517.2,422.5 517.2,433.5" class="tip-r"/><path d="M220 376 L220 269" class="ar ar-g"/><polygon points="220,269 214.5,277.8 225.5,277.8" class="tip-g"/><text x="260" y="318" class="lbl" text-anchor="middle">filtered</text><text x="260" y="333" class="lbl" text-anchor="middle">SSE</text><g><rect x="30" y="526" width="1180" height="180" rx="20" class="region rg-n"/><text x="52" y="556" class="rgt rgt-n">On disk, under DATA_DIR</text></g><g class="k-n"><rect x="50" y="576" width="190" height="104" rx="14" class="card"/><rect x="60" y="589" width="4" height="78" rx="2" class="bar"/><text x="76" y="603" class="t">SQLite index</text><text x="76" y="624" class="s">cache.sqlite: derived,</text><text x="76" y="643" class="s">rebuildable metadata</text><text x="76" y="662" class="s">for search and views</text></g><g class="k-n"><rect x="288" y="576" width="666" height="104" rx="14" class="card"/><rect x="298" y="589" width="4" height="78" rx="2" class="bar"/><text x="314" y="603" class="t">Project files</text><text x="314" y="624" class="s">projects/ and worktrees/: Git-backed definitions, the authoritative copy.</text><text x="314" y="643" class="s">Untouched bytes, serialization and line endings stay unchanged.</text></g><g class="k-n"><rect x="1002" y="576" width="190" height="104" rx="14" class="card"/><rect x="1012" y="589" width="4" height="78" rx="2" class="bar"/><text x="1028" y="603" class="t">Durable state</text><text x="1028" y="624" class="s">state/, admin/, trash/:</text><text x="1028" y="643" class="s">registry, drafts,</text><text x="1028" y="662" class="s">sessions, journals, audit</text></g><path d="M621.0 480 L621.0 576" class="ar ar-n"/><polygon points="621.0,576 615.5,567.2 626.5,567.2" class="tip-n"/><text x="583.0" y="512" class="lbl" text-anchor="middle">atomic</text><text x="583.0" y="527" class="lbl" text-anchor="middle">write</text><path d="M859.0 480 L859.0 576" class="ar ar-n"/><polygon points="859.0,576 853.5,567.2 864.5,567.2" class="tip-n"/><text x="899.0" y="520" class="lbl" text-anchor="middle">commits</text><path d="M1097.0 480 L1097.0 576" class="ar ar-n"/><polygon points="1097.0,576 1091.5,567.2 1102.5,567.2" class="tip-n"/><path d="M288 628 L240 628" class="ar ar-n"/><polygon points="240,628 248.8,622.5 248.8,633.5" class="tip-n"/><text x="264.0" y="600" class="lbl lbl-in-n" text-anchor="middle">scan,</text><text x="264.0" y="615" class="lbl lbl-in-n" text-anchor="middle">watch</text><g><rect x="30" y="736" width="1180" height="378" rx="20" class="region rg-g"/><text x="52" y="766" class="rgt rgt-g">How an edit becomes a saved change</text></g><text x="50" y="804" class="rgt rgt-g" text-anchor="start">In the browser</text><text x="50" y="972" class="rgt rgt-b" text-anchor="start">On the server</text><g class="k-g"><rect x="50" y="816" width="240" height="104" rx="14" class="card"/><rect x="60" y="829" width="4" height="78" rx="2" class="bar"/><text x="76" y="843" class="t">Form or Source edit</text><text x="76" y="864" class="s">Item form, or text typed</text><text x="76" y="883" class="s">in the Source editor</text><text x="76" y="902" class="s">(src/app/edit, editor)</text></g><g class="k-g"><rect x="350" y="816" width="240" height="104" rx="14" class="card"/><rect x="360" y="829" width="4" height="78" rx="2" class="bar"/><text x="376" y="843" class="t">Byte patch</text><text x="376" y="864" class="s">Only the edited range</text><text x="376" y="883" class="s">changes: JSON, YAML and</text><text x="376" y="902" class="s">RDF patches, patch.ts</text></g><g class="k-r"><rect x="650" y="816" width="240" height="104" rx="14" class="card"/><rect x="660" y="829" width="4" height="78" rx="2" class="bar"/><text x="676" y="843" class="t">Validation</text><text x="676" y="864" class="s">Syntax, schema, references</text><text x="676" y="883" class="s">(src/shared/validation);</text><text x="676" y="902" class="s">invalid text stays a draft</text></g><g class="k-g"><rect x="950" y="816" width="240" height="104" rx="14" class="card"/><rect x="960" y="829" width="4" height="78" rx="2" class="bar"/><text x="976" y="843" class="t">Autosave</text><text x="976" y="864" class="s">After the typing pause,</text><text x="976" y="883" class="s">sends the change with the</text><text x="976" y="902" class="s">version hash it was based on</text></g><path d="M290 868 L350 868" class="ar ar-g"/><polygon points="350,868 341.2,862.5 341.2,873.5" class="tip-g"/><text x="320" y="856" class="lbl lbl-in-g" text-anchor="middle">edit</text><path d="M590 868 L650 868" class="ar ar-g"/><polygon points="650,868 641.2,862.5 641.2,873.5" class="tip-g"/><text x="620" y="856" class="lbl lbl-in-g" text-anchor="middle">new text</text><path d="M890 868 L950 868" class="ar ar-g"/><polygon points="950,868 941.2,862.5 941.2,873.5" class="tip-g"/><text x="920" y="856" class="lbl lbl-in-g" text-anchor="middle">valid only</text><g class="k-r"><rect x="50" y="984" width="240" height="104" rx="14" class="card"/><rect x="60" y="997" width="4" height="78" rx="2" class="bar"/><text x="76" y="1011" class="t">Server write gate</text><text x="76" y="1032" class="s">Authorizes every target,</text><text x="76" y="1051" class="s">validates again and</text><text x="76" y="1070" class="s">applies content guards</text></g><g class="k-b"><rect x="350" y="984" width="240" height="104" rx="14" class="card"/><rect x="360" y="997" width="4" height="78" rx="2" class="bar"/><text x="376" y="1011" class="t">Atomic save</text><text x="376" y="1032" class="s">Hash-checked replace;</text><text x="376" y="1051" class="s">a stale hash is refused</text><text x="376" y="1070" class="s">until the person resolves it</text></g><g class="k-b"><rect x="650" y="984" width="240" height="104" rx="14" class="card"/><rect x="660" y="997" width="4" height="78" rx="2" class="bar"/><text x="676" y="1011" class="t">Open views refresh</text><text x="676" y="1032" class="s">Index updated, filtered</text><text x="676" y="1051" class="s">events tell every reader's</text><text x="676" y="1070" class="s">open views to reload</text></g><g class="k-n"><rect x="950" y="984" width="240" height="104" rx="14" class="card"/><rect x="960" y="997" width="4" height="78" rx="2" class="bar"/><text x="976" y="1011" class="t">Git commit</text><text x="976" y="1032" class="s">Explicit action, separate</text><text x="976" y="1051" class="s">from saving; publish and</text><text x="976" y="1070" class="s">push are also separate</text></g><path d="M1070.0 920 L1070.0 938.0 Q1070.0 948 1060.0 948.0 L180.0 948.0 Q170.0 948 170.0 958.0 L170.0 984" class="ar ar-g"/><polygon points="170.0,984 164.5,975.2 175.5,975.2" class="tip-g"/><text x="910" y="942" class="lbl lbl-in-g" text-anchor="middle">save request</text><path d="M290 1036 L350 1036" class="ar ar-g"/><polygon points="350,1036 341.2,1030.5 341.2,1041.5" class="tip-g"/><text x="320" y="1024" class="lbl lbl-in-g" text-anchor="middle">allowed</text><path d="M590 1036 L650 1036" class="ar ar-g"/><polygon points="650,1036 641.2,1030.5 641.2,1041.5" class="tip-g"/><text x="620" y="1024" class="lbl lbl-in-g" text-anchor="middle">saved</text><path d="M890 1036 L950 1036" class="ar ar-n dash"/><polygon points="950,1036 941.2,1030.5 941.2,1041.5" class="tip-n"/><text x="920" y="1024" class="lbl lbl-in-g" text-anchor="middle">commit</text></svg>
