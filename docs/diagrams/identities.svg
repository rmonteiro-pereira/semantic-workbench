.lbl-in-g{stroke:var(--gs)}
.lbl-in-b{stroke:var(--bs)}
.lbl-in-v{stroke:var(--vs)}
.lbl-in-a{stroke:var(--as)}
.lbl-in-r{stroke:var(--rs)}
.lbl-in-n{stroke:var(--ns)}
.ar-n{stroke:var(--edge)} .tip-n{fill:var(--edge)}
.never{fill:var(--rs);stroke:var(--r);stroke-width:1.6;stroke-dasharray:3 6;stroke-linecap:round}
.k-g .card{fill:var(--surface);stroke:var(--gb)} .k-g .bar{fill:var(--g)} .k-g .ct{fill:var(--gt)} .k-g .chip{fill:var(--gs);stroke:var(--gb)} .k-g .chiptxt{fill:var(--gt)}
.rg-g{fill:var(--gs);stroke:var(--gb)} .rgt-g{fill:var(--gt)}
.ar-g{stroke:var(--g)} .tip-g{fill:var(--g)}
.k-b .card{fill:var(--surface);stroke:var(--bb)} .k-b .bar{fill:var(--b)} .k-b .ct{fill:var(--bt)} .k-b .chip{fill:var(--bs);stroke:var(--bb)} .k-b .chiptxt{fill:var(--bt)}
.rg-b{fill:var(--bs);stroke:var(--bb)} .rgt-b{fill:var(--bt)}
.ar-b{stroke:var(--b)} .tip-b{fill:var(--b)}
.k-v .card{fill:var(--surface);stroke:var(--vb)} .k-v .bar{fill:var(--v)} .k-v .ct{fill:var(--vt)} .k-v .chip{fill:var(--vs);stroke:var(--vb)} .k-v .chiptxt{fill:var(--vt)}
.rg-v{fill:var(--vs);stroke:var(--vb)} .rgt-v{fill:var(--vt)}
.ar-v{stroke:var(--v)} .tip-v{fill:var(--v)}
.k-a .card{fill:var(--surface);stroke:var(--ab)} .k-a .bar{fill:var(--a)} .k-a .ct{fill:var(--at)} .k-a .chip{fill:var(--as);stroke:var(--ab)} .k-a .chiptxt{fill:var(--at)}
.rg-a{fill:var(--as);stroke:var(--ab)} .rgt-a{fill:var(--at)}
.ar-a{stroke:var(--a)} .tip-a{fill:var(--a)}
.k-r .card{fill:var(--surface);stroke:var(--rb)} .k-r .bar{fill:var(--r)} .k-r .ct{fill:var(--rt)} .k-r .chip{fill:var(--rs);stroke:var(--rb)} .k-r .chiptxt{fill:var(--rt)}
.rg-r{fill:var(--rs);stroke:var(--rb)} .rgt-r{fill:var(--rt)}
.ar-r{stroke:var(--r)} .tip-r{fill:var(--r)}
.k-n .card{fill:var(--surface);stroke:var(--nb)} .k-n .bar{fill:var(--n)} .k-n .ct{fill:var(--nt)} .k-n .chip{fill:var(--ns);stroke:var(--nb)} .k-n .chiptxt{fill:var(--nt)}
.rg-n{fill:var(--ns);stroke:var(--nb)} .rgt-n{fill:var(--nt)}
.ar-n{stroke:var(--n)} .tip-n{fill:var(--n)}
</style><rect class="bg" width="1240" height="930" rx="24"/><text x="30" y="44" class="title" text-anchor="start">Identities and access</text><text x="30" y="68" class="sub" text-anchor="start">Who can act, how they are recognised, and how every request is decided on the server.</text><g class="k-g"><rect x="560" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="579" y="42" class="s" text-anchor="start">Person</text><g class="k-b"><rect x="642.4" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="661.4" y="42" class="s" text-anchor="start">Sign-in</text><g class="k-v"><rect x="731.7" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="750.7" y="42" class="s" text-anchor="start">Agent</text><g class="k-a"><rect x="807.2" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="826.2" y="42" class="s" text-anchor="start">Break-glass</text><g class="k-r"><rect x="924.1" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="943.1" y="42" class="s" text-anchor="start">Safeguard</text><g class="k-n"><rect x="1027.2" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="1046.2" y="42" class="s" text-anchor="start">Local mode</text><g><rect x="30" y="96" width="240" height="572" rx="20" class="region rg-n"/><text x="52" y="126" class="rgt rgt-n">Who acts</text></g><g><rect x="320" y="96" width="260" height="572" rx="20" class="region rg-b"/><text x="342" y="126" class="rgt rgt-b">Sign-in and session</text></g><g><rect x="650" y="96" width="250" height="572" rx="20" class="region rg-g"/><text x="672" y="126" class="rgt rgt-g">Grants and roles</text></g><g><rect x="970" y="96" width="240" height="572" rx="20" class="region rg-g"/><text x="992" y="126" class="rgt rgt-g">Decision and audit</text></g><g class="k-g"><rect x="50" y="146" width="200" height="104" rx="14" class="card"/><rect x="60" y="159" width="4" height="78" rx="2" class="bar"/><text x="76" y="173" class="t">Person</text><text x="76" y="194" class="s">Browser user, signs in</text><text x="76" y="213" class="s">through the identity</text><text x="76" y="232" class="s">provider (server mode)</text></g><g class="k-n"><rect x="50" y="300" width="200" height="104" rx="14" class="card"/><rect x="60" y="313" width="4" height="78" rx="2" class="bar"/><text x="76" y="327" class="t">Local principal</text><text x="76" y="348" class="s">Local mode only: implicit</text><text x="76" y="367" class="s">Admin on loopback,</text><text x="76" y="386" class="s">no sign-in, no grants</text></g><g class="k-v"><rect x="50" y="523" width="200" height="104" rx="14" class="card"/><rect x="60" y="536" width="4" height="78" rx="2" class="bar"/><text x="76" y="550" class="t">Agent client</text><text x="76" y="571" class="s">Entra application</text><text x="76" y="590" class="s">granted projects or</text><text x="76" y="609" class="s">domains by client ID</text></g><g class="k-b"><rect x="340" y="146" width="220" height="104" rx="14" class="card"/><rect x="350" y="159" width="4" height="78" rx="2" class="bar"/><text x="366" y="173" class="t">Identity provider</text><text x="366" y="194" class="s">Microsoft Entra ID (MSAL)</text><text x="366" y="213" class="s">Keycloak or generic OIDC</text><text x="366" y="232" class="s">No password form in app</text></g><g class="k-b"><rect x="340" y="278" width="220" height="104" rx="14" class="card"/><rect x="350" y="291" width="4" height="78" rx="2" class="bar"/><text x="366" y="305" class="t">Session</text><text x="366" y="326" class="s">Opaque id in HttpOnly cookie</text><text x="366" y="345" class="s">Tokens encrypted server-side</text><text x="366" y="364" class="s">8 h idle, 24 h absolute</text></g><g class="k-b"><rect x="340" y="410" width="220" height="85" rx="14" class="card"/><rect x="350" y="423" width="4" height="59" rx="2" class="bar"/><text x="366" y="437" class="t">Directory (optional)</text><text x="366" y="458" class="s">Microsoft Graph group</text><text x="366" y="477" class="s">lookups for named groups</text></g><g class="k-v"><rect x="340" y="523" width="220" height="104" rx="14" class="card"/><rect x="350" y="536" width="4" height="78" rx="2" class="bar"/><text x="366" y="550" class="t">Bearer token check</text><text x="366" y="571" class="s">Entra app token on</text><text x="366" y="590" class="s">/api/agent/* only: tenant,</text><text x="366" y="609" class="s">audience and idtyp</text></g><g class="k-a"><rect x="670" y="146" width="210" height="104" rx="14" class="card"/><rect x="680" y="159" width="4" height="78" rx="2" class="bar"/><text x="696" y="173" class="t">Bootstrap Admins</text><text x="696" y="194" class="s">SW_BOOTSTRAP_ADMINS:</text><text x="696" y="213" class="s">first Admin, break-glass,</text><text x="696" y="232" class="s">always counted</text></g><g class="k-g"><rect x="670" y="278" width="210" height="104" rx="14" class="card"/><rect x="680" y="291" width="4" height="78" rx="2" class="bar"/><text x="696" y="305" class="t">Grant</text><text x="696" y="326" class="s">A group, verified e-mail</text><text x="696" y="345" class="s">or agent client ID is</text><text x="696" y="364" class="s">given a role at a scope</text></g><g class="k-g"><rect x="670" y="410" width="210" height="104" rx="14" class="card"/><rect x="680" y="423" width="4" height="78" rx="2" class="bar"/><text x="696" y="437" class="t">Role</text><text x="696" y="458" class="s">Viewer, Editor, Steward,</text><text x="696" y="477" class="s">Admin, or a custom role</text><text x="696" y="496" class="s">(never the admin action)</text></g><g class="k-g"><rect x="670" y="542" width="210" height="104" rx="14" class="card"/><rect x="680" y="555" width="4" height="78" rx="2" class="bar"/><text x="696" y="569" class="t">Scope</text><text x="696" y="590" class="s">Workspace, domain or</text><text x="696" y="609" class="s">project. Unassigned</text><text x="696" y="628" class="s">projects need a project grant</text></g><g class="k-g"><rect x="990" y="146" width="200" height="123" rx="14" class="card"/><rect x="1000" y="159" width="4" height="97" rx="2" class="bar"/><text x="1016" y="173" class="t">Cedar policies</text><text x="1016" y="194" class="s">Baseline and role rules</text><text x="1016" y="213" class="s">RBAC: role at a scope</text><text x="1016" y="232" class="s">ABAC: time window (UTC)</text><text x="1016" y="251" class="s">and network (socket peer)</text></g><g class="k-r"><rect x="990" y="297" width="200" height="104" rx="14" class="card"/><rect x="1000" y="310" width="4" height="78" rx="2" class="bar"/><text x="1016" y="324" class="t">Content guards</text><text x="1016" y="345" class="s">Approval, classification</text><text x="1016" y="364" class="s">and protected properties</text><text x="1016" y="383" class="s">checked before any write</text></g><g class="k-g"><rect x="990" y="429" width="200" height="104" rx="14" class="card"/><rect x="1000" y="442" width="4" height="78" rx="2" class="bar"/><text x="1016" y="456" class="t">Outcome</text><text x="1016" y="477" class="s">Allowed</text><text x="1016" y="496" class="s">403: readable, not writable</text><text x="1016" y="515" class="s">404: hidden or missing</text></g><g class="k-g"><rect x="990" y="561" width="200" height="104" rx="14" class="card"/><rect x="1000" y="574" width="4" height="78" rx="2" class="bar"/><text x="1016" y="588" class="t">Audit</text><text x="1016" y="609" class="s">Hash-chained monthly</text><text x="1016" y="628" class="s">files: writes, refusals,</text><text x="1016" y="647" class="s">allowed agent reads</text></g><path d="M250 198 L340 198" class="ar ar-g"/><polygon points="340,198 331.2,192.5 331.2,203.5" class="tip-g"/><text x="295" y="170" class="lbl" text-anchor="middle">OIDC</text><text x="295" y="185" class="lbl" text-anchor="middle">sign-in</text><path d="M450 250 L450 278" class="ar ar-b"/><polygon points="450,278 444.5,269.2 455.5,269.2" class="tip-b"/><path d="M560 330 L670 330" class="ar ar-g"/><polygon points="670,330 661.2,324.5 661.2,335.5" class="tip-g"/><text x="615" y="302" class="lbl" text-anchor="middle">groups,</text><text x="615" y="317" class="lbl" text-anchor="middle">verified e-mail</text><path d="M250 575 L340 575" class="ar ar-v"/><polygon points="340,575 331.2,569.5 331.2,580.5" class="tip-v"/><text x="295" y="547" class="lbl" text-anchor="middle">bearer</text><text x="295" y="562" class="lbl" text-anchor="middle">token</text><path d="M560 575 L610.0 575.0 Q620 575 620.0 565.0 L620.0 368.0 Q620 358 630.0 358.0 L670 358" class="ar ar-v"/><polygon points="670,358 661.2,352.5 661.2,363.5" class="tip-v"/><text x="620" y="470" class="lbl" text-anchor="middle">client ID</text><path d="M775 250 L775 278" class="ar ar-a dash"/><polygon points="775,278 769.5,269.2 780.5,269.2" class="tip-a"/><path d="M775 382 L775 410" class="ar ar-g"/><polygon points="775,410 769.5,401.2 780.5,401.2" class="tip-g"/><path d="M775 514 L775 542" class="ar ar-g"/><polygon points="775,542 769.5,533.2 780.5,533.2" class="tip-g"/><path d="M880 462 L925.0 462.0 Q935 462 935.0 452.0 L935.0 218.0 Q935 208 945.0 208.0 L990 208" class="ar ar-g"/><polygon points="990,208 981.2,202.5 981.2,213.5" class="tip-g"/><text x="935" y="340" class="lbl" text-anchor="middle">scoped</text><text x="935" y="355" class="lbl" text-anchor="middle">roles</text><path d="M1090 269 L1090 297" class="ar ar-g"/><polygon points="1090,297 1084.5,288.2 1095.5,288.2" class="tip-g"/><path d="M1090 401 L1090 429" class="ar ar-r"/><polygon points="1090,429 1084.5,420.2 1095.5,420.2" class="tip-r"/><path d="M1090 533 L1090 561" class="ar ar-g"/><polygon points="1090,561 1084.5,552.2 1095.5,552.2" class="tip-g"/><path d="M450 382 L450 410" class="ar ar-b dash"/><polygon points="450,410 444.5,401.2 455.5,401.2" class="tip-b"/><g><rect x="30" y="700" width="1180" height="200" rx="20" class="region rg-n"/><text x="52" y="730" class="rgt rgt-n">Changing access: review before it takes effect</text></g><g class="k-g"><rect x="50" y="750" width="205" height="123" rx="14" class="card"/><rect x="60" y="763" width="4" height="97" rx="2" class="bar"/><text x="76" y="777" class="t">Proposal</text><text x="76" y="798" class="s">Typed change to grants,</text><text x="76" y="817" class="s">roles, policies or users</text><text x="76" y="836" class="s">(deactivate, reactivate)</text><text x="76" y="855" class="s">made by an Admin</text></g><g class="k-g"><rect x="283" y="750" width="205" height="123" rx="14" class="card"/><rect x="293" y="763" width="4" height="97" rx="2" class="bar"/><text x="309" y="777" class="t">Dry run</text><text x="309" y="798" class="s">Replays matrix cases,</text><text x="309" y="817" class="s">recent audit and known</text><text x="309" y="836" class="s">identities; live policy</text><text x="309" y="855" class="s">stays unchanged</text></g><g class="k-r"><rect x="516" y="750" width="205" height="123" rx="14" class="card"/><rect x="526" y="763" width="4" height="97" rx="2" class="bar"/><text x="542" y="777" class="t">Last-Admin guard</text><text x="542" y="798" class="s">Refuses removing,</text><text x="542" y="817" class="s">narrowing or deactivating</text><text x="542" y="836" class="s">the last Admin: error</text><text x="542" y="855" class="s">last-admin</text></g><g class="k-g"><rect x="749" y="750" width="205" height="123" rx="14" class="card"/><rect x="759" y="763" width="4" height="97" rx="2" class="bar"/><text x="775" y="777" class="t">Confirm</text><text x="775" y="798" class="s">One Admin-authored</text><text x="775" y="817" class="s">commit in DATA_DIR/admin/</text><text x="775" y="836" class="s">Rollback is a new</text><text x="775" y="855" class="s">reviewed commit</text></g><g class="k-a"><rect x="982" y="750" width="205" height="123" rx="14" class="card"/><rect x="992" y="763" width="4" height="97" rx="2" class="bar"/><text x="1008" y="777" class="t">Effect</text><text x="1008" y="798" class="s">Affected browser sessions</text><text x="1008" y="817" class="s">reload; deactivation ends</text><text x="1008" y="836" class="s">the person's sessions;</text><text x="1008" y="855" class="s">audit keeps the record</text></g><path d="M255 811 L283 811" class="ar ar-g"/><polygon points="283,811 274.2,805.5 274.2,816.5" class="tip-g"/><path d="M488 811 L516 811" class="ar ar-r"/><polygon points="516,811 507.2,805.5 507.2,816.5" class="tip-r"/><path d="M721 811 L749 811" class="ar ar-g"/><polygon points="749,811 740.2,805.5 740.2,816.5" class="tip-g"/><path d="M954 811 L982 811" class="ar ar-g"/><polygon points="982,811 973.2,805.5 973.2,816.5" class="tip-g"/></svg>
