<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1230" width="1240" height="1230" role="img" aria-labelledby="t d"><title id="t">Integrations and boundaries</title><desc id="d">What Semantic Workbench reads, what it can talk to when configured, how it is deployed and what it never does.</desc><style>
svg{--bg:#f7f9f9;--surface:#ffffff;--region:#eef3f1;--border:#dbe3e4;--borderStrong:#c3d3ce;--text:#243936;--muted:#566c65;--edge:#6f8c80;--g:#247c66;--gs:#e9f4ef;--gb:#cfe6da;--gt:#1e6a4f;--b:#3b82b0;--bs:#eaf3fa;--bb:#c7dff0;--bt:#26668f;--v:#7a6bd6;--vs:#f1eefc;--vb:#d9d3f5;--vt:#5a4bb5;--a:#b07a2a;--as:#fbf3e3;--ab:#ecd9b0;--at:#8a5d14;--r:#c2493f;--rs:#fcefed;--rb:#f0c6c1;--rt:#a53a31;--n:#8ba198;--ns:#f2f6f4;--nb:#dbe3e4;--nt:#3a5a50;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme: dark){svg{--bg:#121918;--surface:#1a2422;--region:#0f1514;--border:#2f3f3c;--borderStrong:#67807a;--text:#e4ede9;--muted:#a3b8b1;--edge:#86a99b;--g:#46b597;--gs:#1b3a33;--gb:#2e5a4e;--gt:#6dd0b4;--b:#5aa7d6;--bs:#182a3b;--bb:#2d4b68;--bt:#8fc8ee;--v:#b3a8f5;--vs:#2a2448;--vb:#433c75;--vt:#cfc7fb;--a:#d9a441;--as:#332c10;--ab:#5e5021;--at:#f1dc92;--r:#f0685d;--rs:#3a1f1d;--rb:#6c3833;--rt:#ff9d92;--n:#7f9a90;--ns:#1f2b29;--nb:#2f3f3c;--nt:#c6d5d0}}
.bg{fill:var(--bg)}
.region{stroke-width:1.2}
.rgt{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.card{stroke-width:1.4}
.t{font-size:14.5px;font-weight:700;fill:var(--text)}
.s{font-size:13px;fill:var(--muted)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:var(--muted)}
.ink{fill:var(--text)}
.title{font-size:22px;font-weight:700;fill:var(--text)}
.sub{font-size:14px;fill:var(--muted)}
.chiptxt{font-size:12.5px;font-weight:600}
.chip{stroke-width:1}
.ar{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:6 5}
.lbl{font-size:12.5px;font-weight:600;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
.lbl-in-g{stroke:var(--gs)}
.lbl-in-b{stroke:var(--bs)}
.lbl-in-v{stroke:var(--vs)}
.lbl-in-a{stroke:var(--as)}
.lbl-in-r{stroke:var(--rs)}
.lbl-in-n{stroke:var(--ns)}
.ar-n{stroke:var(--edge)} .tip-n{fill:var(--edge)}
.never{fill:var(--rs);stroke:var(--r);stroke-width:1.6;stroke-dasharray:3 6;stroke-linecap:round}
.k-g .card{fill:var(--surface);stroke:var(--gb)} .k-g .bar{fill:var(--g)} .k-g .ct{fill:var(--gt)} .k-g .chip{fill:var(--gs);stroke:var(--gb)} .k-g .chiptxt{fill:var(--gt)}
.rg-g{fill:var(--gs);stroke:var(--gb)} .rgt-g{fill:var(--gt)}
.ar-g{stroke:var(--g)} .tip-g{fill:var(--g)}
.k-b .card{fill:var(--surface);stroke:var(--bb)} .k-b .bar{fill:var(--b)} .k-b .ct{fill:var(--bt)} .k-b .chip{fill:var(--bs);stroke:var(--bb)} .k-b .chiptxt{fill:var(--bt)}
.rg-b{fill:var(--bs);stroke:var(--bb)} .rgt-b{fill:var(--bt)}
.ar-b{stroke:var(--b)} .tip-b{fill:var(--b)}
.k-v .card{fill:var(--surface);stroke:var(--vb)} .k-v .bar{fill:var(--v)} .k-v .ct{fill:var(--vt)} .k-v .chip{fill:var(--vs);stroke:var(--vb)} .k-v .chiptxt{fill:var(--vt)}
.rg-v{fill:var(--vs);stroke:var(--vb)} .rgt-v{fill:var(--vt)}
.ar-v{stroke:var(--v)} .tip-v{fill:var(--v)}
.k-a .card{fill:var(--surface);stroke:var(--ab)} .k-a .bar{fill:var(--a)} .k-a .ct{fill:var(--at)} .k-a .chip{fill:var(--as);stroke:var(--ab)} .k-a .chiptxt{fill:var(--at)}
.rg-a{fill:var(--as);stroke:var(--ab)} .rgt-a{fill:var(--at)}
.ar-a{stroke:var(--a)} .tip-a{fill:var(--a)}
.k-r .card{fill:var(--surface);stroke:var(--rb)} .k-r .bar{fill:var(--r)} .k-r .ct{fill:var(--rt)} .k-r .chip{fill:var(--rs);stroke:var(--rb)} .k-r .chiptxt{fill:var(--rt)}
.rg-r{fill:var(--rs);stroke:var(--rb)} .rgt-r{fill:var(--rt)}
.ar-r{stroke:var(--r)} .tip-r{fill:var(--r)}
.k-n .card{fill:var(--surface);stroke:var(--nb)} .k-n .bar{fill:var(--n)} .k-n .ct{fill:var(--nt)} .k-n .chip{fill:var(--ns);stroke:var(--nb)} .k-n .chiptxt{fill:var(--nt)}
.rg-n{fill:var(--ns);stroke:var(--nb)} .rgt-n{fill:var(--nt)}
.ar-n{stroke:var(--n)} .tip-n{fill:var(--n)}
</style><rect class="bg" width="1240" height="1230" rx="24"/><text x="30" y="44" class="title" text-anchor="start">What it talks to, and what it never does</text><text x="30" y="68" class="sub" text-anchor="start">Dashed lines are optional or explicit, used only when configured. Nothing leaves the boundary on its own.</text><g class="k-g"><rect x="700" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="719" y="42" class="s" text-anchor="start">Files and browser</text><g class="k-b"><rect x="858.3" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="877.3" y="42" class="s" text-anchor="start">Server</text><g class="k-v"><rect x="940.6999999999999" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="959.6999999999999" y="42" class="s" text-anchor="start">Agent</text><g class="k-n"><rect x="1016.1999999999999" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="1035.1999999999998" y="42" class="s" text-anchor="start">Storage</text><g class="k-r"><rect x="1105.5" y="31" width="12" height="12" rx="4" class="bar"/></g><text x="1124.5" y="42" class="s" text-anchor="start">Never</text><g><rect x="30" y="96" width="290" height="690" rx="20" class="region rg-n"/><text x="52" y="126" class="rgt rgt-n">Files in</text></g><g><rect x="360" y="96" width="400" height="690" rx="20" class="region rg-g"/><text x="382" y="126" class="rgt rgt-g">Semantic Workbench</text></g><g><rect x="860" y="96" width="350" height="690" rx="20" class="region rg-n"/><text x="882" y="126" class="rgt rgt-n">Outside systems</text></g><g class="k-g"><rect x="50" y="146" width="250" height="104" rx="14" class="card"/><rect x="60" y="159" width="4" height="78" rx="2" class="bar"/><text x="76" y="173" class="t">ODCS data contracts</text><text x="76" y="194" class="s">Open Data Contract Standard,</text><text x="76" y="213" class="s">YAML or JSON, checked</text><text x="76" y="232" class="s">against pinned schema 3.1.0</text></g><g class="k-g"><rect x="50" y="274" width="250" height="104" rx="14" class="card"/><rect x="60" y="287" width="4" height="78" rx="2" class="bar"/><text x="76" y="301" class="t">Ossie definitions</text><text x="76" y="322" class="s">Ontology, semantic model and</text><text x="76" y="341" class="s">mappings, YAML or JSON,</text><text x="76" y="360" class="s">schema 0.2.0.dev0</text></g><g class="k-g"><rect x="50" y="402" width="250" height="104" rx="14" class="card"/><rect x="60" y="415" width="4" height="78" rx="2" class="bar"/><text x="76" y="429" class="t">OWL and RDF</text><text x="76" y="450" class="s">Turtle, N-Triples, N3 and</text><text x="76" y="469" class="s">RDF/XML; OWL/XML and</text><text x="76" y="488" class="s">JSON-LD are not read</text></g><g class="k-g"><rect x="50" y="530" width="250" height="104" rx="14" class="card"/><rect x="60" y="543" width="4" height="78" rx="2" class="bar"/><text x="76" y="557" class="t">SHACL shapes</text><text x="76" y="578" class="s">Turtle or RDF/XML shapes run</text><text x="76" y="597" class="s">against one chosen data file,</text><text x="76" y="616" class="s">SPARQL constraints included</text></g><g class="k-n"><rect x="50" y="658" width="250" height="104" rx="14" class="card"/><rect x="60" y="671" width="4" height="78" rx="2" class="bar"/><text x="76" y="685" class="t">Nothing fetched</text><text x="76" y="706" class="s">No remote schema, ontology</text><text x="76" y="725" class="s">or owl:imports is loaded</text><text x="76" y="744" class="s">at run time</text></g><g class="k-g"><rect x="380" y="146" width="360" height="142" rx="14" class="card"/><rect x="390" y="159" width="4" height="116" rx="2" class="bar"/><text x="406" y="173" class="t">Browser workspace</text><text x="406" y="194" class="s">React views, editors and graphs</text><text x="406" y="213" class="s">SHACL runs in a worker: no</text><text x="406" y="232" class="s">network, stopped after 30 s</text><text x="406" y="251" class="s">Show query previews SQL;</text><text x="406" y="270" class="s">Export agent context downloads</text></g><g><rect x="380" y="318" width="360" height="448" rx="20" class="region rg-b"/><text x="402" y="348" class="rgt rgt-b">Bun server</text></g><g class="k-b"><rect x="400" y="364" width="320" height="104" rx="14" class="card"/><rect x="410" y="377" width="4" height="78" rx="2" class="bar"/><text x="426" y="391" class="t">Identity and access</text><text x="426" y="412" class="s">Sessions, grants and Cedar;</text><text x="426" y="431" class="s">OIDC client, bearer-token</text><text x="426" y="450" class="s">check and the audit record</text></g><g class="k-v"><rect x="400" y="488" width="320" height="123" rx="14" class="card"/><rect x="410" y="501" width="4" height="97" rx="2" class="bar"/><text x="426" y="515" class="t">Agent API</text><text x="426" y="536" class="s">/api/agent/projects, catalog,</text><text x="426" y="555" class="s">context and plan: filtered</text><text x="426" y="574" class="s">metadata, explanations and</text><text x="426" y="593" class="s">SQL previews, never executed</text></g><g class="k-b"><rect x="400" y="632" width="320" height="104" rx="14" class="card"/><rect x="410" y="645" width="4" height="78" rx="2" class="bar"/><text x="426" y="659" class="t">Files, Git and diagnostics</text><text x="426" y="680" class="s">Project files, SQLite index,</text><text x="426" y="699" class="s">Git subprocesses, logs and</text><text x="426" y="718" class="s">optional telemetry export</text></g><path d="M560 288 L560 318" class="ar ar-g"/><polygon points="560,318 554.5,309.2 565.5,309.2" class="tip-g"/><text x="650" y="308" class="lbl lbl-in-g" text-anchor="middle">HTTP, JSON, SSE</text><g class="k-b"><rect x="880" y="146" width="310" height="142" rx="14" class="card"/><rect x="890" y="159" width="4" height="116" rx="2" class="bar"/><text x="906" y="173" class="t">Identity provider</text><text x="906" y="194" class="s">Entra ID (MSAL), or Keycloak /</text><text x="906" y="213" class="s">generic OIDC: shared-server</text><text x="906" y="232" class="s">sign-in only</text><text x="906" y="251" class="s">Microsoft Graph: optional</text><text x="906" y="270" class="s">group lookups</text></g><g class="k-v"><rect x="880" y="308" width="310" height="123" rx="14" class="card"/><rect x="890" y="321" width="4" height="97" rx="2" class="bar"/><text x="906" y="335" class="t">Agent client</text><text x="906" y="356" class="s">Your own software, using an</text><text x="906" y="375" class="s">Entra application token on</text><text x="906" y="394" class="s">/api/agent/* only. Any query</text><text x="906" y="413" class="s">execution stays with it</text></g><g class="k-n"><rect x="880" y="451" width="310" height="161" rx="14" class="card"/><rect x="890" y="464" width="4" height="135" rx="2" class="bar"/><text x="906" y="478" class="t">Git hosting</text><text x="906" y="499" class="s">HTTPS hosts on an allow-list</text><text x="906" y="518" class="s">Clone, fetch, pull, push:</text><text x="906" y="537" class="s">explicit actions only</text><text x="906" y="556" class="s">Azure DevOps: Entra token</text><text x="906" y="575" class="s">exchange where configured</text><text x="906" y="594" class="s">GitHub: connect your account</text></g><g class="k-n"><rect x="880" y="632" width="310" height="104" rx="14" class="card"/><rect x="890" y="645" width="4" height="78" rx="2" class="bar"/><text x="906" y="659" class="t">Azure Monitor</text><text x="906" y="680" class="s">Opt-in telemetry export,</text><text x="906" y="699" class="s">server mode only, off by</text><text x="906" y="718" class="s">default</text></g><path d="M300 217 L380 217" class="ar ar-g"/><polygon points="380,217 371.2,211.5 371.2,222.5" class="tip-g"/><text x="340" y="190" class="lbl" text-anchor="middle">open,</text><text x="340" y="205" class="lbl" text-anchor="middle">import</text><path d="M720 416 L790.0 416.0 Q800 416 800.0 406.0 L800.0 227.0 Q800 217 810.0 217.0 L880 217" class="ar ar-b dash"/><polygon points="880,217 871.2,211.5 871.2,222.5" class="tip-b"/><text x="810" y="340" class="lbl" text-anchor="middle">OIDC</text><text x="810" y="355" class="lbl" text-anchor="middle">sign-in</text><path d="M880 369 L830.0 369.0 Q820 369 820.0 379.0 L820.0 539.0 Q820 549 810.0 549.0 L720 549" class="ar ar-v"/><polygon points="720,549 728.8,543.5 728.8,554.5" class="tip-v"/><text x="820" y="455" class="lbl" text-anchor="middle">bearer</text><text x="820" y="470" class="lbl" text-anchor="middle">token</text><path d="M720 660 L830.0 660.0 Q840 660 840.0 650.0 L840.0 541.0 Q840 531 850.0 531.0 L880 531" class="ar ar-n dash"/><polygon points="880,531 871.2,525.5 871.2,536.5" class="tip-n"/><text x="840" y="598" class="lbl" text-anchor="middle">explicit</text><text x="840" y="613" class="lbl" text-anchor="middle">commands</text><path d="M720 712 L880 712" class="ar ar-n dash"/><polygon points="880,712 871.2,706.5 871.2,717.5" class="tip-n"/><text x="800" y="700" class="lbl" text-anchor="middle">opt-in export</text><g><rect x="30" y="816" width="1180" height="170" rx="20" class="region rg-r"/><text x="52" y="846" class="rgt rgt-r">Outside the boundary: what it never does</text></g><g class="k-r"><rect x="50" y="864" width="265" height="104" rx="14" class="card dash"/><rect x="60" y="877" width="4" height="78" rx="2" class="bar"/><text x="76" y="891" class="t">Warehouse connection</text><text x="76" y="912" class="s">No database source is</text><text x="76" y="931" class="s">contacted and no previewed</text><text x="76" y="950" class="s">SQL is executed</text></g><g class="k-r"><circle cx="285" cy="892" r="12" fill="none" stroke="var(--r)" stroke-width="2"/><path d="M278 899 L292 885" stroke="var(--r)" stroke-width="2" stroke-linecap="round"/></g><g class="k-r"><rect x="335" y="864" width="265" height="104" rx="14" class="card dash"/><rect x="345" y="877" width="4" height="78" rx="2" class="bar"/><text x="361" y="891" class="t">Live metric values</text><text x="361" y="912" class="s">Metrics are definitions and</text><text x="361" y="931" class="s">SQL previews, never</text><text x="361" y="950" class="s">measured numbers</text></g><g class="k-r"><circle cx="570" cy="892" r="12" fill="none" stroke="var(--r)" stroke-width="2"/><path d="M563 899 L577 885" stroke="var(--r)" stroke-width="2" stroke-linecap="round"/></g><g class="k-r"><rect x="620" y="864" width="265" height="104" rx="14" class="card dash"/><rect x="630" y="877" width="4" height="78" rx="2" class="bar"/><text x="646" y="891" class="t">OWL reasoning</text><text x="646" y="912" class="s">Structure and SHACL</text><text x="646" y="931" class="s">checks only; no reasoner</text><text x="646" y="950" class="s">and no standards inference</text></g><g class="k-r"><circle cx="855" cy="892" r="12" fill="none" stroke="var(--r)" stroke-width="2"/><path d="M848 899 L862 885" stroke="var(--r)" stroke-width="2" stroke-linecap="round"/></g><g class="k-r"><rect x="905" y="864" width="265" height="104" rx="14" class="card dash"/><rect x="915" y="877" width="4" height="78" rx="2" class="bar"/><text x="931" y="891" class="t">Hosted language model</text><text x="931" y="912" class="s">Not required and never</text><text x="931" y="931" class="s">called; the agent client</text><text x="931" y="950" class="s">brings its own</text></g><g class="k-r"><circle cx="1140" cy="892" r="12" fill="none" stroke="var(--r)" stroke-width="2"/><path d="M1133 899 L1147 885" stroke="var(--r)" stroke-width="2" stroke-linecap="round"/></g><g><rect x="30" y="1016" width="1180" height="190" rx="20" class="region rg-n"/><text x="52" y="1046" class="rgt rgt-n">Deployment and outputs</text></g><g class="k-n"><rect x="50" y="1066" width="265" height="123" rx="14" class="card"/><rect x="60" y="1079" width="4" height="97" rx="2" class="bar"/><text x="76" y="1093" class="t">Container image</text><text x="76" y="1114" class="s">Bun, Git, API and built</text><text x="76" y="1133" class="s">frontend; UID 1000, writes</text><text x="76" y="1152" class="s">only /data and /tmp.</text><text x="76" y="1171" class="s">Podman or Docker</text></g><g class="k-n"><rect x="335" y="1066" width="265" height="123" rx="14" class="card"/><rect x="345" y="1079" width="4" height="97" rx="2" class="bar"/><text x="361" y="1093" class="t">One writer per data root</text><text x="361" y="1114" class="s">One active instance owns</text><text x="361" y="1133" class="s">DATA_DIR. /healthz is</text><text x="361" y="1152" class="s">liveness; /readyz reports</text><text x="361" y="1171" class="s">ownership and scan state</text></g><g class="k-n"><rect x="620" y="1066" width="265" height="123" rx="14" class="card"/><rect x="630" y="1079" width="4" height="97" rx="2" class="bar"/><text x="646" y="1093" class="t">Logs and audit</text><text x="646" y="1114" class="s">JSON logs on stdout (server)</text><text x="646" y="1133" class="s">Hash-chained audit files</text><text x="646" y="1152" class="s">under state/audit, checked</text><text x="646" y="1171" class="s">by bun run audit:verify</text></g><g class="k-n"><rect x="905" y="1066" width="265" height="123" rx="14" class="card"/><rect x="915" y="1079" width="4" height="97" rx="2" class="bar"/><text x="931" y="1093" class="t">Browser reports</text><text x="931" y="1114" class="s">Bounded error and timing</text><text x="931" y="1133" class="s">reports go to the workbench</text><text x="931" y="1152" class="s">API only, never to a</text><text x="931" y="1171" class="s">third-party collector</text></g></svg>
