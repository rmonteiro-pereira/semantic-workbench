version: 0.2.0.dev0
name: Subscription billing ontology
description: "Fictional subscription-to-cash model: account governance,
  contracts, entitlements, usage, invoicing, collections and revenue
  recognition."
ai_context:
  instructions: InvoiceLine is the revenue grain. NetRevenue excludes tax and
    credits. RecurringRevenue excludes usage-only lines. This fixture is
    USD-only; do not combine currencies in production without governed
    conversion. Account can mean billed or subscribed account; do not infer that
    those roles are equivalent.
ontology:
  - concept: Account
    type: EntityType
    identify_by:
      - id
    description: Account in the subscription-to-cash lifecycle.
    relationships:
      - name: id
        roles:
          - concept: Identifier
        multiplicity: ManyToOne
        verbalizes:
          - "{Account} has identifier {Identifier}"
      - name: industry
        roles:
          - concept: Industry
        multiplicity: ManyToOne
        verbalizes:
          - "{Account} has industry {Industry}"
      - name: segment
        roles:
          - concept: CustomerSegment
        multiplicity: ManyToOne
        verbalizes:
          - "{Account} has segment {CustomerSegment}"
      - name: territory
        roles:
          - concept: SalesTerritory
        multiplicity: ManyToOne
        verbalizes:
          - "{Account} has territory {SalesTerritory}"
      - name: success_manager
        roles:
          - concept: CustomerSuccessManager
        multiplicity: ManyToOne
        verbalizes:
          - "{Account} has success_manager {CustomerSuccessManager}"
