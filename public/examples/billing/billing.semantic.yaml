version: 0.2.0.dev0
name: Subscription billing semantic model
description: One row per business entity; invoice_lines is the monetary fact grain.
ai_context:
  instructions: Primary keys describe unique dimension rows. Multiple account and
    billing-cycle roles are distinct. Credits, taxes and refunds have separate
    grains and are excluded from net_revenue.
