    to: credit_notes
    from_columns:
      - credit_note_id
    to_columns:
      - id
  - name: dunning_cases_invoice
    from: dunning_cases
    to: invoices
    from_columns:
      - invoice_id
    to_columns:
      - id
  - name: collection_actions_case
    from: collection_actions
    to: dunning_cases
    from_columns:
      - case_id
    to_columns:
      - id
  - name: recognition_schedules_invoice_line
    from: recognition_schedules
    to: invoice_lines
    from_columns:
      - invoice_line_id
    to_columns:
      - id
  - name: journal_entries_legal_entity
    from: journal_entries
    to: legal_entities
    from_columns:
      - legal_entity_id
    to_columns:
      - id
  - name: journal_lines_entry
    from: journal_lines
    to: journal_entries
    from_columns:
      - entry_id
    to_columns:
      - id
  - name: journal_lines_recognition_schedule
    from: journal_lines
    to: recognition_schedules
    from_columns:
      - recognition_schedule_id
    to_columns:
      - id
metrics:
  - name: net_revenue
    description: Invoice-line quantity × unit price minus line discount, excluding
      tax and credits.
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(invoice_lines.net_amount)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Net revenue",
            "type": "simple",
            "additivity": "additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Finance",
            "status": "approved",
            "time": {
              "dimension": "invoices.invoice_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "plans.tier",
              "product_families.name",
              "currencies.code"
            ]
          }
  - name: recurring_revenue
    description: Only recurring invoice lines; usage-only lines are excluded.
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN invoice_lines.is_recurring = 1 THEN
            invoice_lines.net_amount ELSE 0 END)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Recurring revenue",
            "type": "simple",
            "additivity": "additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Finance",
            "status": "approved",
            "time": {
              "dimension": "invoices.invoice_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "plans.tier",
              "product_families.name",
              "currencies.code"
            ]
          }
  - name: invoice_count
    description: Distinct invoices represented by the selected lines. Not additive
      across product or plan groups.
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT invoice_lines.invoice_id)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Invoice count",
            "type": "simple",
            "additivity": "non_additive",
            "unit": "invoices",
            "format": "#,##0",
            "owner": "Billing Operations",
            "status": "approved",
            "time": {
              "dimension": "invoices.invoice_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "plans.tier",
              "product_families.name",
              "currencies.code"
            ]
          }
  - name: revenue_per_invoice
    description: Governed net revenue divided by distinct represented invoices.
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: net_revenue / NULLIF(invoice_count, 0)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Revenue per invoice",
            "type": "ratio",
            "numerator": "net_revenue",
            "denominator": "invoice_count",
            "additivity": "non_additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Finance",
            "status": "approved",
            "time": {
              "dimension": "invoices.invoice_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "plans.tier",
              "product_families.name",
              "currencies.code"
            ]
          }
  - name: recurring_share
    description: Share of net revenue that comes from recurring invoice lines.
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: recurring_revenue / NULLIF(net_revenue, 0)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Recurring share",
            "type": "ratio",
            "numerator": "recurring_revenue",
            "denominator": "net_revenue",
            "additivity": "non_additive",
            "unit": "ratio",
            "format": "0.0%",
            "owner": "Finance",
            "status": "proposed",
            "time": {
              "dimension": "invoices.invoice_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "plans.tier",
              "product_families.name",
              "currencies.code"
            ],
            "targets": [
              {
                "grain": "month",
                "direction": "higher_is_better",
                "value": 0.9
              }
            ]
          }
  - name: discounts_given
    description: Discount amount granted on invoice lines, before tax.
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(invoice_lines.discount_amount)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Discounts given",
            "type": "simple",
            "additivity": "additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Sales Operations",
            "status": "approved",
            "time": {
              "dimension": "invoices.invoice_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "plans.tier",
              "product_families.name",
              "currencies.code"
            ]
          }
  - name: tax_billed
    description: Tax amount charged on invoice lines. It is not part of net revenue.
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(invoice_lines.tax_amount)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Tax billed",
            "type": "simple",
            "additivity": "additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Tax",
            "status": "approved",
            "time": {
              "dimension": "invoices.invoice_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "plans.tier",
              "currencies.code"
            ]
          }
  - name: gross_billings
    description: "Net revenue plus the discounts given: what the lines would bill at
      list price."
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: net_revenue + discounts_given
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Gross billings",
            "type": "derived",
            "inputs": [
              "net_revenue",
              "discounts_given"
            ],
            "additivity": "additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Finance",
            "status": "draft",
            "time": {
              "dimension": "invoices.invoice_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "plans.tier",
              "product_families.name",
              "currencies.code"
            ]
          }
