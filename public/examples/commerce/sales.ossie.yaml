version: 0.2.0.dev0
name: Commerce sales
description: Revenue and order metrics over contracted warehouse tables.
datasets:
  - name: customers
    source: analytics.commerce.customers
    description: Registered customers. One row per customer.
    primary_key:
      - customer_id
    fields:
      - name: customer_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: customer_id
        datatype: Integer
      - name: name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: name
        datatype: String
      - name: email
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: email
        datatype: String
  - name: orders
    source: analytics.commerce.orders
    description: Placed orders. Cancelled orders are retained; totals are in USD.
    primary_key:
      - order_id
    fields:
      - name: order_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_id
        datatype: Integer
      - name: customer_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: customer_id
        datatype: Integer
      - name: order_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_date
        datatype: Date
        dimension:
          is_time: true
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: status
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: status
        datatype: String
  - name: order_lines
    source: analytics.commerce.order_lines
    description: One row per product line in an order.
    primary_key:
      - line_id
    fields:
      - name: line_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: line_id
        datatype: Integer
      - name: order_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_id
        datatype: Integer
      - name: product_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: product_id
        datatype: Integer
      - name: quantity
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: quantity
        datatype: Integer
      - name: line_amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: line_amount
        datatype: Decimal
  - name: products
    source: analytics.commerce.products
    description: Sellable product catalog.
    primary_key:
      - product_id
    fields:
      - name: product_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: product_id
        datatype: Integer
      - name: name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: name
        datatype: String
      - name: unit_price
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: unit_price
        datatype: Decimal
relationships:
  - name: orders_customer
    from: orders
    to: customers
    from_columns:
      - customer_id
    to_columns:
      - customer_id
  - name: lines_order
    from: order_lines
    to: orders
    from_columns:
      - order_id
    to_columns:
      - order_id
  - name: lines_product
    from: order_lines
    to: products
    from_columns:
      - product_id
    to_columns:
      - product_id
metrics:
  - name: gross_revenue
    description: Order amount before refunds. Aggregate orders only to avoid
      multiplying totals by lines.
    datatype: Decimal
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(orders.amount)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Gross revenue",
            "type": "simple",
            "additivity": "additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Finance",
            "status": "approved",
            "time": {
              "dimension": "orders.order_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "customers.name",
              "orders.status"
            ]
          }
  - name: order_count
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT orders.order_id)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Order count",
            "type": "simple",
            "additivity": "non_additive",
            "unit": "orders",
            "format": "#,##0",
            "owner": "Sales Operations",
            "status": "approved",
            "time": {
              "dimension": "orders.order_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "customers.name",
              "orders.status"
            ]
          }
  - name: average_order_value
    datatype: Decimal
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: gross_revenue / NULLIF(order_count, 0)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Average order value",
            "type": "ratio",
            "numerator": "gross_revenue",
            "denominator": "order_count",
            "additivity": "non_additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Finance",
            "status": "approved",
            "time": {
              "dimension": "orders.order_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "customers.name",
              "orders.status"
            ],
            "targets": [
              {
                "grain": "month",
                "direction": "higher_is_better",
                "value": 120
              }
            ]
          }
  - name: units_sold
    description: Product units on order lines. Cancelled orders are included; filter
      by order status to exclude them.
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(order_lines.quantity)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Units sold",
            "type": "simple",
            "additivity": "additive",
            "unit": "units",
            "format": "#,##0",
            "owner": "Merchandising",
            "status": "approved",
            "time": {
              "dimension": "orders.order_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "products.name",
              "customers.name",
              "orders.status"
            ]
          }
  - name: line_revenue
    description: Revenue of order lines. Aggregate lines, not orders, when slicing
      by product.
    datatype: Decimal
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(order_lines.line_amount)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Line revenue",
            "type": "simple",
            "additivity": "additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Merchandising",
            "status": "approved",
            "time": {
              "dimension": "orders.order_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "products.name",
              "customers.name",
              "orders.status"
            ]
          }
  - name: revenue_per_unit
    description: Line revenue divided by units sold.
    datatype: Decimal
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: line_revenue / NULLIF(units_sold, 0)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Revenue per unit",
            "type": "ratio",
            "numerator": "line_revenue",
            "denominator": "units_sold",
            "additivity": "non_additive",
            "unit": "USD",
            "format": "#,##0.00",
            "owner": "Merchandising",
            "status": "proposed",
            "time": {
              "dimension": "orders.order_date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "products.name",
              "customers.name"
            ]
          }
