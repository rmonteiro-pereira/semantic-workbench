apiVersion: v3.1.0
kind: DataContract
id: 5f0b8a3e-2c41-4d7a-9b6e-8a1c3e5d7f20
name: Shopping center administration contract
version: 1.0.0
status: active
domain: Shopping center administration
dataProduct: Retail real estate operations
description:
  purpose: Governed tables for leasing, billing, operations and performance reporting of shopping centers.
  limitations: Fictional demonstration data in BRL. No real tenants, people or properties.
schema:
  - name: organizations
    physicalName: mall.organizations
    physicalType: table
    logicalType: object
    description: Legal entity such as a company, fund, bank, insurer, public authority or condominium association that is not otherwise specialised.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#Organization
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Organization.
      - name: name
        logicalType: string
        required: true
        description: Name used in day-to-day administration.
      - name: legal_name
        logicalType: string
        required: false
        description: Registered legal name.
      - name: tax_id
        logicalType: string
        required: false
        description: Tax registration number.
      - name: email
        logicalType: string
        required: false
        description: Main email address.
      - name: phone
        logicalType: string
        required: false
        description: Main phone number.
      - name: organization_type
        logicalType: string
        required: false
        description: Kind of organization, for example bank, insurer, appraiser, authority or law firm.
      - name: address_id
        logicalType: integer
        required: false
        description: "Reference to Address: Registered or correspondence address."
      - name: parent_organization_id
        logicalType: integer
        required: false
        description: "Reference to Organization: Economic group or parent company."
  - name: people
    physicalName: mall.people
    physicalType: table
    logicalType: object
    description: Natural person, such as a tenant contact, property manager or individual guarantor.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#Person
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Person.
      - name: name
        logicalType: string
        required: true
        description: Name used in day-to-day administration.
      - name: legal_name
        logicalType: string
        required: false
        description: Registered legal name.
      - name: tax_id
        logicalType: string
        required: false
        description: Tax registration number.
      - name: email
        logicalType: string
        required: false
        description: Main email address.
      - name: phone
        logicalType: string
        required: false
        description: Main phone number.
      - name: job_title
        logicalType: string
        required: false
        description: Job title or role description.
      - name: address_id
        logicalType: integer
        required: false
        description: "Reference to Address: Registered or correspondence address."
  - name: addresses
    physicalName: mall.addresses
    physicalType: table
    logicalType: object
    description: Postal address of a property or party.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#Address
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Address.
      - name: street
        logicalType: string
        required: true
        description: Street name.
      - name: street_number
        logicalType: string
        required: false
        description: Street number.
      - name: complement
        logicalType: string
        required: false
        description: Additional address detail.
      - name: district
        logicalType: string
        required: false
        description: District or neighbourhood.
      - name: postal_code
        logicalType: string
        required: false
        description: Postal code.
      - name: city_id
        logicalType: integer
        required: true
        description: "Reference to City: City of the address."
  - name: cities
    physicalName: mall.cities
    physicalType: table
    logicalType: object
    description: Municipality.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#City
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the City.
      - name: name
        logicalType: string
        required: true
        description: City name.
      - name: state_id
        logicalType: integer
        required: true
        description: "Reference to StateProvince: State or province of the city."
  - name: state_provinces
    physicalName: mall.state_provinces
    physicalType: table
    logicalType: object
    description: State, province or other first-level administrative region.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#StateProvince
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the StateProvince.
      - name: name
        logicalType: string
        required: true
        description: State name.
      - name: code
        logicalType: string
        required: false
        description: Abbreviation.
      - name: country_id
        logicalType: integer
        required: true
        description: "Reference to Country: Country of the region."
  - name: countries
    physicalName: mall.countries
    physicalType: table
    logicalType: object
    description: Country.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#Country
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Country.
      - name: name
        logicalType: string
        required: true
        description: Country name.
      - name: iso_code
        logicalType: string
        required: true
        description: ISO 3166-1 alpha-2 code.
  - name: currencies
    physicalName: mall.currencies
    physicalType: table
    logicalType: object
    description: Currency in which leases, invoices and accounts are denominated.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#Currency
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Currency.
      - name: name
        logicalType: string
        required: true
        description: Currency name.
      - name: iso_code
        logicalType: string
        required: true
        description: ISO 4217 code.
  - name: calendar_months
    physicalName: mall.calendar_months
    physicalType: table
    logicalType: object
    description: Reporting and billing period. Charges, sales reports, occupancy snapshots and ledger entries are stated per month.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#CalendarMonth
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the CalendarMonth.
      - name: year_month
        logicalType: string
        required: true
        description: Month in YYYY-MM form.
      - name: year
        logicalType: integer
        required: true
        description: Calendar year.
      - name: month_number
        logicalType: integer
        required: true
        description: Month of the year, 1 to 12.
      - name: quarter
        logicalType: string
        required: false
        description: Calendar quarter, for example 2026-Q3.
  - name: price_indices
    physicalName: mall.price_indices
    physicalType: table
    logicalType: object
    description: Inflation index used to adjust rents, such as IGP-M or IPCA in Brazil or a consumer price index elsewhere.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#PriceIndex
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the PriceIndex.
      - name: name
        logicalType: string
        required: true
        description: Index name.
      - name: code
        logicalType: string
        required: true
        description: Index code.
      - name: publisher
        logicalType: string
        required: false
        description: Publishing institution.
  - name: price_index_values
    physicalName: mall.price_index_values
    physicalType: table
    logicalType: object
    description: Published level and monthly change of a price index.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/core#PriceIndexValue
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the PriceIndexValue.
      - name: index_level
        logicalType: number
        required: true
        description: Index level for the month.
      - name: monthly_change
        logicalType: number
        required: false
        description: Change against the previous month as a fraction.
      - name: price_index_id
        logicalType: integer
        required: true
        description: "Reference to PriceIndex: Index being published."
      - name: month_id
        logicalType: integer
        required: true
        description: "Reference to CalendarMonth: Reference month."
  - name: portfolios
    physicalName: mall.portfolios
    physicalType: table
    logicalType: object
    description: Group of properties managed under one strategy or fund.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#Portfolio
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Portfolio.
      - name: name
        logicalType: string
        required: true
        description: Portfolio name.
      - name: strategy
        logicalType: string
        required: false
        description: Investment or management strategy.
      - name: asset_manager_id
        logicalType: integer
        required: false
        description: "Reference to Organization: Asset manager responsible for the portfolio."
  - name: properties
    physicalName: mall.properties
    physicalType: table
    logicalType: object
    description: Shopping center or other managed real-estate asset. Gross leasable area (GLA, in Portuguese ABL) is the area available for lease to tenants.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#Property
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Property.
      - name: code
        logicalType: string
        required: true
        description: Property code.
      - name: name
        logicalType: string
        required: true
        description: Property name.
      - name: property_format
        logicalType: string
        required: false
        description: Format, for example regional, super-regional, community, outlet, lifestyle or power center.
      - name: opening_date
        logicalType: date
        required: false
        description: Date the property opened to the public.
      - name: total_gla_m2
        logicalType: number
        required: true
        description: Gross leasable area.
      - name: gross_built_area_m2
        logicalType: number
        required: false
        description: Total built area.
      - name: parking_spaces
        logicalType: integer
        required: false
        description: Number of parking spaces.
      - name: portfolio_id
        logicalType: integer
        required: true
        description: "Reference to Portfolio: Portfolio of the property."
      - name: address_id
        logicalType: integer
        required: true
        description: "Reference to Address: Address of the property."
      - name: currency_id
        logicalType: integer
        required: true
        description: "Reference to Currency: Currency of leases and accounts."
      - name: administrator_id
        logicalType: integer
        required: false
        description: "Reference to Organization: Company contracted to administer the property."
      - name: general_manager_id
        logicalType: integer
        required: false
        description: "Reference to Person: General manager of the property."
  - name: buildings
    physicalName: mall.buildings
    physicalType: table
    logicalType: object
    description: Structure within a property, such as the mall, an office tower or a parking building.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#Building
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Building.
      - name: code
        logicalType: string
        required: true
        description: Building code.
      - name: name
        logicalType: string
        required: false
        description: Building name.
      - name: built_year
        logicalType: integer
        required: false
        description: Year of completion.
      - name: property_id
        logicalType: integer
        required: true
        description: "Reference to Property: Property containing the building."
  - name: floors
    physicalName: mall.floors
    physicalType: table
    logicalType: object
    description: Floor or level of a building.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#Floor
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Floor.
      - name: code
        logicalType: string
        required: true
        description: Floor code, for example L1.
      - name: name
        logicalType: string
        required: false
        description: Floor name.
      - name: level_number
        logicalType: integer
        required: false
        description: Level number; negative below ground.
      - name: building_id
        logicalType: integer
        required: true
        description: "Reference to Building: Building of the floor."
  - name: zones
    physicalName: mall.zones
    physicalType: table
    logicalType: object
    description: Wing, corridor or sector of a floor used to locate units and plan the tenant mix.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#Zone
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Zone.
      - name: code
        logicalType: string
        required: true
        description: Zone code.
      - name: name
        logicalType: string
        required: false
        description: Zone name.
      - name: floor_id
        logicalType: integer
        required: true
        description: "Reference to Floor: Floor of the zone."
  - name: units
    physicalName: mall.units
    physicalType: table
    logicalType: object
    description: Store, kiosk or other unit that counts towards gross leasable area and can be leased to a tenant.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#LeasableUnit
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the LeasableUnit.
      - name: code
        logicalType: string
        required: true
        description: Space code, for example a store number.
      - name: name
        logicalType: string
        required: false
        description: Space name.
      - name: area_m2
        logicalType: number
        required: true
        description: Measured area.
      - name: frontage_m
        logicalType: number
        required: false
        description: Shop-front length.
      - name: has_mezzanine
        logicalType: boolean
        required: false
        description: Whether the unit has a mezzanine.
      - name: zone_id
        logicalType: integer
        required: true
        description: "Reference to Zone: Zone of the unit."
      - name: unit_type_id
        logicalType: integer
        required: true
        description: "Reference to UnitType: Unit type."
  - name: unit_types
    physicalName: mall.unit_types
    physicalType: table
    logicalType: object
    description: "Classification of units: anchor, mega-store, inline store, kiosk, food court, restaurant, entertainment, services, office or storage."
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#UnitType
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the UnitType.
      - name: code
        logicalType: string
        required: true
        description: Unit type code.
      - name: name
        logicalType: string
        required: true
        description: Unit type name.
      - name: counts_as_gla
        logicalType: boolean
        required: true
        description: Whether units of this type count towards gross leasable area.
  - name: common_areas
    physicalName: mall.common_areas
    physicalType: table
    logicalType: object
    description: "Shared area operated by the property: corridors, food-court seating, restrooms, loading docks and technical areas. Its costs are recovered through service charges."
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#CommonArea
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the CommonArea.
      - name: code
        logicalType: string
        required: true
        description: Space code, for example a store number.
      - name: name
        logicalType: string
        required: false
        description: Space name.
      - name: area_m2
        logicalType: number
        required: true
        description: Measured area.
      - name: area_kind
        logicalType: string
        required: false
        description: Kind of common area.
      - name: floor_id
        logicalType: integer
        required: true
        description: "Reference to Floor: Floor of the common area."
  - name: parking_facilities
    physicalName: mall.parking_facilities
    physicalType: table
    logicalType: object
    description: Parking area of a property.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#ParkingFacility
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the ParkingFacility.
      - name: code
        logicalType: string
        required: true
        description: Space code, for example a store number.
      - name: name
        logicalType: string
        required: false
        description: Space name.
      - name: area_m2
        logicalType: number
        required: true
        description: Measured area.
      - name: capacity
        logicalType: integer
        required: true
        description: Number of parking spaces.
      - name: is_paid
        logicalType: boolean
        required: false
        description: Whether visitors pay for parking.
      - name: property_id
        logicalType: integer
        required: true
        description: "Reference to Property: Property served by the facility."
  - name: entrances
    physicalName: mall.entrances
    physicalType: table
    logicalType: object
    description: Visitor entrance where footfall is counted.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#Entrance
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Entrance.
      - name: code
        logicalType: string
        required: true
        description: Entrance code.
      - name: name
        logicalType: string
        required: false
        description: Entrance name.
      - name: entrance_kind
        logicalType: string
        required: false
        description: Pedestrian, parking, public transport or service.
      - name: property_id
        logicalType: integer
        required: true
        description: "Reference to Property: Property of the entrance."
  - name: area_measurements
    physicalName: mall.area_measurements
    physicalType: table
    logicalType: object
    description: Certified measurement of a unit area under a stated method.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#AreaMeasurement
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the AreaMeasurement.
      - name: measurement_date
        logicalType: date
        required: true
        description: Measurement date.
      - name: measured_area_m2
        logicalType: number
        required: true
        description: Measured area.
      - name: method
        logicalType: string
        required: false
        description: Measurement standard.
      - name: unit_id
        logicalType: integer
        required: true
        description: "Reference to LeasableUnit: Unit measured."
      - name: surveyor_id
        logicalType: integer
        required: false
        description: "Reference to Organization: Surveyor."
  - name: ownership_stakes
    physicalName: mall.ownership_stakes
    physicalType: table
    logicalType: object
    description: Fractional ownership of a property by an investor. Shopping centers are often held in undivided shares by several investors.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#OwnershipStake
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the OwnershipStake.
      - name: share
        logicalType: number
        required: true
        description: Ownership fraction.
      - name: start_date
        logicalType: date
        required: true
        description: Start of ownership.
      - name: end_date
        logicalType: date
        required: false
        description: End of ownership.
      - name: investor_id
        logicalType: integer
        required: true
        description: "Reference to Investor: Owner of the stake."
      - name: property_id
        logicalType: integer
        required: true
        description: "Reference to Property: Property owned."
  - name: valuations
    physicalName: mall.valuations
    physicalType: table
    logicalType: object
    description: Appraisal of the market value of a property.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#Valuation
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Valuation.
      - name: valuation_date
        logicalType: date
        required: true
        description: Valuation date.
      - name: market_value
        logicalType: number
        required: true
        description: Appraised market value.
      - name: capitalization_rate
        logicalType: number
        required: false
        description: Capitalization rate applied.
      - name: discount_rate
        logicalType: number
        required: false
        description: Discount rate applied.
      - name: property_id
        logicalType: integer
        required: true
        description: "Reference to Property: Property valued."
      - name: appraiser_id
        logicalType: integer
        required: false
        description: "Reference to Organization: Appraiser."
  - name: permits
    physicalName: mall.permits
    physicalType: table
    logicalType: object
    description: Licence or certificate required to operate the property, such as an occupancy certificate, fire safety certificate or operating licence.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#Permit
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Permit.
      - name: permit_number
        logicalType: string
        required: true
        description: Permit number.
      - name: permit_type
        logicalType: string
        required: true
        description: Permit type.
      - name: issue_date
        logicalType: date
        required: false
        description: Issue date.
      - name: expiry_date
        logicalType: date
        required: false
        description: Expiry date.
      - name: property_id
        logicalType: integer
        required: true
        description: "Reference to Property: Property covered."
      - name: issuer_id
        logicalType: integer
        required: false
        description: "Reference to Organization: Issuing authority."
  - name: equipment
    physicalName: mall.equipment
    physicalType: table
    logicalType: object
    description: Maintained building equipment such as escalators, elevators, chillers, generators and fire pumps.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/asset#Equipment
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Equipment.
      - name: tag
        logicalType: string
        required: true
        description: Asset tag.
      - name: name
        logicalType: string
        required: true
        description: Equipment name.
      - name: equipment_type
        logicalType: string
        required: true
        description: Equipment type.
      - name: install_date
        logicalType: date
        required: false
        description: Installation date.
      - name: manufacturer
        logicalType: string
        required: false
        description: Manufacturer.
      - name: property_id
        logicalType: integer
        required: true
        description: "Reference to Property: Property of the equipment."
  - name: tenants
    physicalName: mall.tenants
    physicalType: table
    logicalType: object
    description: Retailer, restaurant or service operator that leases space in a property.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://example.org/mall/party#Tenant
    properties:
      - name: id
        logicalType: integer
        required: true
        primaryKey: true
        unique: true
        description: Identifier of the Tenant.
      - name: name
        logicalType: string
        required: true
        description: Name used in day-to-day administration.
      - name: legal_name
        logicalType: string
        required: false
        description: Registered legal name.
      - name: tax_id
        logicalType: string
        required: false
        description: Tax registration number.
      - name: email
        logicalType: string
        required: false
        description: Main email address.
      - name: phone
        logicalType: string
        required: false
        description: Main phone number.
      - name: organization_type
        logicalType: string
        required: false
        description: Kind of organization, for example bank, insurer, appraiser, authority or law firm.
      - name: trade_name
        logicalType: string
        required: false
        description: Trading name used at the store.
      - name: address_id
        logicalType: integer
        required: false
        description: "Reference to Address: Registered or correspondence address."
      - name: parent_organization_id
