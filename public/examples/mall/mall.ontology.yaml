version: 0.2.0.dev0
name: Shopping center administration ontology
description: "Fictional reference model for administering shopping centers and other retail real estate: assets and space, tenants and brands, the leasing pipeline, leases and their clauses, service charges and operations, billing and collections, accounting and investor distributions, and performance facts. Each module has its own namespace."
ai_context:
  instructions: Gross leasable area (GLA, Portuguese ABL) counts only leasable units. Occupancy is measured on area, not unit count, from month-end snapshots; never sum area across months. Minimum rent and percentage rent are separate charges; percentage rent is billed only when rate × gross sales exceeds minimum rent. A thirteenth minimum rent may be billed in December. Service charges recover shared operating costs; the marketing fund is a separate tenant contribution. Key money or right-of-use fees are not rent. A charge has a contracted tenant (through its lease) and a billed tenant (through its invoice); do not treat these roles as interchangeable. Lease permitted use is the tenant-mix category of record. All fixture amounts are in Brazilian reais (BRL).
  synonyms:
    - shopping mall
    - shopping center administration
    - retail real estate
    - property management
    - ABL
    - condomínio
    - fundo de promoção
prefixes:
  core: https://example.org/mall/core#
  asset: https://example.org/mall/asset#
  party: https://example.org/mall/party#
  lease: https://example.org/mall/lease#
  legal: https://example.org/mall/legal#
  hr: https://example.org/mall/hr#
  proc: https://example.org/mall/proc#
  ops: https://example.org/mall/ops#
  fin: https://example.org/mall/fin#
  perf: https://example.org/mall/perf#
  kpi: https://example.org/mall/kpi#
ontology:
  - concept: Party
    type: EntityType
    iri: core:Party
    description: Abstract legal or natural person. The roles a party plays (tenant, investor, broker, supplier, employee, legal entity, contract counterparty) are separate concepts that refer to the party, so one company can be a supplier and a counterparty at the same time.
    identify_by:
      - id
    relationships:
      - name: id
        iri: core:partyId
        description: Identifier of the Party.
        roles:
          - concept: Identifier
        multiplicity: OneToOne
        verbalizes:
          - "{Party} is identified by {Identifier}"
      - name: name
        iri: core:partyName
        description: Name used in day-to-day administration.
        roles:
          - concept: Name
        multiplicity: ManyToOne
        verbalizes:
          - "{Party} has name {Name}"
      - name: legal_name
        iri: core:partyLegalName
        description: Registered legal name.
        roles:
          - concept: Name
        multiplicity: ManyToOne
        verbalizes:
          - "{Party} has legal name {Name}"
      - name: tax_id
        iri: core:partyTaxId
        description: Tax registration number.
        roles:
          - concept: TaxId
        multiplicity: ManyToOne
        verbalizes:
          - "{Party} has tax id {TaxId}"
      - name: email
        iri: core:partyEmail
        description: Main email address.
        roles:
          - concept: EmailAddress
        multiplicity: ManyToOne
        verbalizes:
          - "{Party} has email {EmailAddress}"
      - name: phone
        iri: core:partyPhone
        description: Main phone number.
        roles:
          - concept: PhoneNumber
        multiplicity: ManyToOne
        verbalizes:
          - "{Party} has phone {PhoneNumber}"
      - name: address
        iri: core:partyAddress
        description: Registered or correspondence address.
        roles:
          - concept: Address
        multiplicity: ManyToOne
        verbalizes:
          - "{Party} is located at {Address}"
