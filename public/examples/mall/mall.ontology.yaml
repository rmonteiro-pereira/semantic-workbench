    description: Monetary amount in the currency of the property or lease.
  - concept: Rate
    type: ValueType
    iri: core:Rate
    extends:
      - Decimal
    description: Fraction where 1 means 100 percent.
  - concept: IndexNumber
    type: ValueType
    iri: core:IndexNumber
    extends:
      - Decimal
    description: Published price-index level.
  - concept: TotalGla
    type: ValueType
    iri: kpi:TotalGla
