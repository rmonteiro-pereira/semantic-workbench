version: 0.2.0.dev0
name: Shopping center administration semantic model
description: "One dataset per concrete business concept. Facts: occupancy_snapshots (unit-month), charges (lease-charge type-month), sales_reports (lease-month), footfall_counts (entrance-period), journal_lines (ledger line) and parking_activity (facility-month)."
ai_context:
  instructions: "Use governed metrics by name. Area metrics are month-end stocks: filter or group by month. A charge reaches tenants through its lease (contracted tenant) and through its invoice (billed tenant); choose the role explicitly. Properties are reached from occupancy through unit, zone, floor and building."
