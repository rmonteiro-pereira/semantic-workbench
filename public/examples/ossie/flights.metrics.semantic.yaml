# Workbench addition: governed metrics for the Flights example.
# This file is not part of the upstream Apache Ossie examples, which stay unchanged. It repeats the
# Flights tables the metrics read, with the joins the upstream semantic model does not declare, and
# keeps the same physical sources.
version: 0.2.0.dev0
name: Flights metrics
description: Governed flight, delay and distance metrics over the Flights warehouse tables.
datasets:
  - name: FLIGHT
    source: DATABASE.SCHEMA.FLIGHTS
    description: A commercial passenger flight.
    primary_key:
      - id
    fields:
      - name: id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: id
        datatype: Integer
      - name: carrier_code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: carrier_code
        datatype: String
      - name: route_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: route_id
        datatype: Integer
      - name: date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: date
        datatype: Date
      - name: distance
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: distance
        datatype: Integer
      - name: dep_delay
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: dep_delay
        datatype: Integer
      - name: arr_delay
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: arr_delay
        datatype: Integer
  - name: CARRIER
    source: DATABASE.SCHEMA.CARRIERS
    description: An airline, such as Delta, United, or American.
    primary_key:
      - code
    fields:
      - name: code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: code
        datatype: String
      - name: name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: name
        datatype: String
  - name: ROUTE
    source: DATABASE.SCHEMA.ROUTES
    description: One or more flights between a departure and an arrival airport.
    primary_key:
      - id
    fields:
      - name: id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: id
        datatype: Integer
      - name: orig_airport_code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: orig_airport_code
        datatype: String
      - name: distance
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: distance
        datatype: Integer
  - name: AIRPORT
    source: DATABASE.SCHEMA.AIRPORTS
    description: An airport that is identified by an IATA code.
    primary_key:
      - code
    fields:
      - name: code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: code
        datatype: String
      - name: name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: name
        datatype: String
      - name: state_code
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: state_code
        datatype: String
relationships:
  - name: flight_carrier
    from: FLIGHT
    to: CARRIER
    from_columns:
      - carrier_code
    to_columns:
      - code
  - name: flight_route
    from: FLIGHT
    to: ROUTE
    from_columns:
      - route_id
    to_columns:
      - id
  - name: route_origin_airport
    from: ROUTE
    to: AIRPORT
    from_columns:
      - orig_airport_code
    to_columns:
      - code
metrics:
  - name: flight_count
    description: Flights in the selected period.
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(FLIGHT.id)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "time": {
              "dimension": "FLIGHT.date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "CARRIER.name",
              "AIRPORT.name"
            ],
            "label": "Flights",
            "type": "simple",
            "additivity": "additive",
            "unit": "flights",
            "format": "#,##0",
            "owner": "Network Planning",
            "status": "approved"
          }
  - name: total_distance
    description: Flown distance in statute miles.
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(FLIGHT.distance)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "time": {
              "dimension": "FLIGHT.date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "CARRIER.name",
              "AIRPORT.name"
            ],
            "label": "Total distance",
            "type": "simple",
            "additivity": "additive",
            "unit": "mi",
            "format": "#,##0",
            "owner": "Network Planning",
            "status": "approved"
          }
  - name: total_departure_delay
    description: Minutes flights left after their scheduled departure; early departures count as negative.
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(FLIGHT.dep_delay)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "time": {
              "dimension": "FLIGHT.date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "CARRIER.name",
              "AIRPORT.name"
            ],
            "label": "Total departure delay",
            "type": "simple",
            "additivity": "additive",
            "unit": "min",
            "format": "#,##0",
            "owner": "Operations",
            "status": "approved"
          }
  - name: total_arrival_delay
    description: Minutes flights arrived after their scheduled arrival; early arrivals count as negative.
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(FLIGHT.arr_delay)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "time": {
              "dimension": "FLIGHT.date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "CARRIER.name",
              "AIRPORT.name"
            ],
            "label": "Total arrival delay",
            "type": "simple",
            "additivity": "additive",
            "unit": "min",
            "format": "#,##0",
            "owner": "Operations",
            "status": "approved"
          }
  - name: delay_recovered
    description: "Minutes made up in the air: departure delay minus arrival delay."
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: total_departure_delay - total_arrival_delay
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "time": {
              "dimension": "FLIGHT.date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "CARRIER.name",
              "AIRPORT.name"
            ],
            "label": "Delay recovered",
            "type": "derived",
            "inputs": [
              "total_departure_delay",
              "total_arrival_delay"
            ],
            "additivity": "additive",
            "unit": "min",
            "format": "#,##0",
            "owner": "Operations",
            "status": "draft"
          }
  - name: average_arrival_delay
    description: Total arrival delay per flight.
    datatype: Decimal
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: total_arrival_delay / NULLIF(flight_count, 0)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "time": {
              "dimension": "FLIGHT.date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "CARRIER.name",
              "AIRPORT.name"
            ],
            "label": "Average arrival delay",
            "type": "ratio",
            "numerator": "total_arrival_delay",
            "denominator": "flight_count",
            "additivity": "non_additive",
            "unit": "min",
            "format": "#,##0.0",
            "owner": "Operations",
            "status": "approved",
            "targets": [
              {
                "grain": "month",
                "direction": "lower_is_better",
                "value": 10
              }
            ]
          }
  - name: average_flight_distance
    description: Total distance per flight.
    datatype: Decimal
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: total_distance / NULLIF(flight_count, 0)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "time": {
              "dimension": "FLIGHT.date",
              "min_grain": "day",
              "allowed_grains": [
                "day",
                "week",
                "month",
                "quarter",
                "year"
              ]
            },
            "dimensions": [
              "CARRIER.name",
              "AIRPORT.name"
            ],
            "label": "Average flight distance",
            "type": "ratio",
            "numerator": "total_distance",
            "denominator": "flight_count",
            "additivity": "non_additive",
            "unit": "mi",
            "format": "#,##0",
            "owner": "Network Planning",
            "status": "proposed"
          }
