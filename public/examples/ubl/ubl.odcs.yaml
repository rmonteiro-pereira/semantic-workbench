    logicalType: object
    physicalType: table
    physicalName: analytics.ubl.purchase_order__order_document_reference
    description: Bridge for repeatable UBL Order.OrderDocumentReference →
      DocumentReference; source occurrences 0..unbounded.
    properties:
      - name: record_id
        logicalType: string
        required: true
        primaryKey: true
        unique: true
      - name: source_id
        logicalType: string
        required: true
        relationships:
          - type: foreignKey
            to: purchase_order.record_id
      - name: target_id
        logicalType: string
        required: true
