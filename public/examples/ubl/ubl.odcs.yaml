apiVersion: v3.1.0
kind: DataContract
id: 47a8a25a-c671-4ade-92fe-247da9af2240
name: UBL procurement-to-payment analytical contract
version: 1.0.0
status: draft
domain: Procurement and logistics
description:
  purpose: Analytical projection of a 45-component UBL 2.3 subset, with surrogate
    keys and bridge tables for repeating aggregate roles.
  limitations: Not the UBL XML schema. Surrogate IDs, normalization and type
    mappings are application choices. Components outside the selected subset are
    omitted.
schema:
