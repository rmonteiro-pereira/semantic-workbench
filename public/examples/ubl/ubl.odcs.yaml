  - name: purchase_order
    logicalType: object
    physicalType: table
    physicalName: analytics.ubl.purchase_order
    description: UBL 2.3 Order component, projected from its published XSD. Roles
      retain source min/max occurrence counts.
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://docs.oasis-open.org/ubl/os-UBL-2.3/xsd/maindoc/UBL-Order-2.3.xsd#OrderType
