        logicalType: string
        required: true
        primaryKey: true
        unique: true
        description: Application-generated surrogate ID for the analytical projection;
          not a UBL XML field.
      - name: ublversion_id
        logicalType: string
        required: false
        description: Source cbc:UBLVersionID; occurrences 0..1. Repeating basic fields
          are represented as arrays in this projection.
      - name: customization_id
        logicalType: string
        required: false
        description: Source cbc:CustomizationID; occurrences 0..1. Repeating basic
          fields are represented as arrays in this projection.
