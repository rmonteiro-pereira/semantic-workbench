    source: analytics.ubl.purchase_order__order_document_reference
    primary_key:
      - record_id
    description: Bridge for repeatable UBL Order.OrderDocumentReference →
      DocumentReference; source occurrences 0..unbounded.
    fields:
      - name: record_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: record_id
        datatype: String
      - name: source_id
        expression:
          dialects:
