metrics:
  - name: order_count
    datatype: Integer
    description: Count of projected order headers, independent of line and
      bridge-table grain.
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT purchase_order.record_id)
  - name: invoice_count
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT invoice.record_id)
  - name: shipment_count
    datatype: Integer
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT shipment.record_id)
