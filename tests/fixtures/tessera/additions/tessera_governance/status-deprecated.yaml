tessera: 2
version: 0.2.0.dev0
name: Retail
ontology:
  - concept: LoyaltyTier
    type: ValueType
  - concept: Order
    type: EntityType
  - concept: Customer
    type: EntityType
    tessera_governance:
      status: deprecated
      replaced_by: Order
      deprecation_reason: Replaced by the order concept.
    relationships:
      - name: email
        roles: [{ concept: String }]
        verbalizes: ["{Customer} has {email}"]
      - name: tier
        roles: [{ concept: LoyaltyTier }]
        verbalizes: ["{Customer} has {tier}"]
      - name: places
        roles: [{ concept: Order }]
        verbalizes: ["{Customer} places {Order}"]
