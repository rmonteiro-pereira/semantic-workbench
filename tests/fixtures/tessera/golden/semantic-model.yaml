version: 0.2.0.dev0
name: retail_model
datasets:
  - name: ORDERS
    source: db.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: ORDERS.amount
metrics:
  - name: revenue
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(ORDERS.amount)
    custom_extensions:
      - vendor_name: SEMANTIC_WORKBENCH
        data: |
          {
            "schema": "semantic-workbench/metric/v1",
            "label": "Revenue",
            "type": "simple",
            "additivity": "additive",
            "unit": "currency",
            "format": "#,##0",
            "owner": "Finance",
            "status": "approved"
          }
